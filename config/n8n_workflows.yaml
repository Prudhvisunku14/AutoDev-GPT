# n8n workflows DevPilot may trigger (ARCHITECTURE §8.1). Used only when N8N_ENABLED=true.
# GPT names a key and supplies values for exactly the listed inputs; it never supplies a URL or a path.
# Each key needs a matching active workflow in n8n whose Webhook node uses `path` (see n8n/workflows/).
#
#   path:        one URL segment; DevPilot posts to <N8N_BASE_URL>/webhook/<path>
#   description: what a person reads before approving the trigger
#   inputs:      the input names the workflow accepts (all required, string values)
#   callback:    true if the workflow posts its result to POST /integrations/n8n/callback
#   effect:      required. What the workflow does beyond receiving the trigger: read_only, notify, write or destructive.
#                N8N_AUTO_APPROVE=true skips approval only for read_only and notify; write and destructive always wait for a person.

workflows:
  notify:
    path: devpilot-notify
    description: Send a short notification (a title and a message) to the channels configured in this n8n workflow.
    inputs: [title, message]
    callback: false
    effect: notify
  echo:
    path: devpilot-echo
    description: Round-trip check. n8n receives the text and posts it back to DevPilot's callback, proving both directions work.
    inputs: [text]
    callback: true
    effect: read_only
  run-events:
    path: devpilot-run-events
    description: Forward one run event (what happened and a one-line summary) to the team's channel configured in this workflow, for example when a build is delivered, fails or waits for approval.
    inputs: [event, summary]
    callback: false
    effect: notify
