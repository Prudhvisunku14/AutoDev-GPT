[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-backend"
version = "0.1.0"
description = "DevPilot AI backend: GPT-orchestrated autonomous software development"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1.0",  # Depends(scope="function") for commit-before-response
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: needs Docker; skipped unless RUN_DOCKER_TESTS=true (Phase 3+)",
    "live_openai: calls the real OpenAI API; needs approval",
    "live_opencode: calls a real OpenCode server; needs approval",
    "live_n8n: calls a real n8n instance; needs approval",
    "live_google: calls real Google APIs; needs approval",
    "live_github: calls the real GitHub API; needs approval",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
