# DevPilot's own pytest configuration for the fastapi-pytest recipe (app/verification/recipes.py), at
# /opt/verify/pytest.ini in devpilot/verify-fastapi:1 and passed with --config-file. A project's own pytest.ini, pyproject.toml,
# tox.ini or setup.cfg is then never read, so it cannot add options or plugins, change which tests run, or reshape the
# output the parser reads. The recipe sets the root, the conftest boundary and the import path to the checked component
# folder on the command line.
[pytest]
console_output_style = classic
